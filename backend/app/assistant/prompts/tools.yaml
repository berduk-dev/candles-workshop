# Описания инструментов для модели. Ключ — имя инструмента; params — пояснения к аргументам.

list_materials:
  description: Список всех материалов с остатками (остаток, резерв, свободно, на проверке).
get_material_stock:
  description: Остаток и свободный остаток материала с разбивкой по партиям. Если под название подходит несколько материалов, вернёт все.
  params:
    material: Код («WAX-SOY») или название в любой форме («соевый воск», «стаканы»).
list_batches:
  description: Поиск партий по материалу, поставщику, статусу и датам поступления. Возвращает до 30 последних.
  params:
    material: Код или часть названия материала.
    supplier: Поставщик — код вида SUP-001 из сообщения пользователя или название как написал пользователь (опечатки исправит сам инструмент).
    status: on_check — на проверке, accepted — принята, rejected — брак.
    received_from: Дата поступления не раньше, ГГГГ-ММ-ДД.
    received_to: Дата поступления не позже, ГГГГ-ММ-ДД.
get_batch_history:
  description: История партии — поступление, смены статуса, движения (выдача, перерасход, возврат), резервы под задания, комментарий.
  params:
    batch_number: Номер партии, например П-000012.
list_jobs:
  description: Список производственных заданий с фильтрами по статусу и плановой дате. На вопросы «что просрочено / опаздывает» вызывай с overdue=true, без дат и статуса.
  params:
    overdue: true — только просроченные — плановая дата прошла, а задание запланировано или в работе.
    status: draft — черновик, planned — запланировано, in_progress — в работе, completed — завершено, cancelled — отменено.
    date_from: Плановая дата не раньше, ГГГГ-ММ-ДД.
    date_to: Плановая дата не позже, ГГГГ-ММ-ДД.
get_job:
  description: Карточка задания — компоненты, резервы, дефицит, история, отправка в маркировку.
  params:
    job_number: Номер задания, например З-000003.
check_availability:
  description: Хватит ли свободных материалов на N изделий по рецепту — по каждому материалу нужно, есть сейчас и сколько не хватит (резервы других заданий уже учтены). На вопросы «хватит ли / можно ли сделать N свечей» вызывай его, а не собирай ответ из остатков. В ответе назови, чего и сколько не хватает (поле shortage).
  params:
    recipe: Название рецепта, например «Сандал».
    qty: Сколько изделий, целое число.
get_spending:
  description: Сколько денег ушло за период — два разных числа — закупки (стоимость поступлений) и расход в производство (себестоимость израсходованного). На вопросы «сколько потратили / сколько ушло денег» вызывай его, а не Code Interpreter, и назови в ответе оба числа, каждое со своим пояснением из поля meaning.
  params:
    date_from: Начало периода, ГГГГ-ММ-ДД. «Последний месяц» без уточнений — с этого же числа прошлого месяца; в ответе называй период датами.
    date_to: Конец периода включительно, ГГГГ-ММ-ДД.
    material: Ограничить материалом — код или название («воск» — все виды воска).
get_deficit:
  description: Каких материалов не хватает на запланированные задания за период. Без заданий в периоде вернёт пустой список.
  params:
    date_from: Начало периода, ГГГГ-ММ-ДД.
    date_to: Конец периода включительно, ГГГГ-ММ-ДД.
get_job_cost:
  description: Себестоимость задания по партиям — всего, на единицу и по материалам.
  params:
    job_number: Номер задания, например З-000003.
    currency: Валюта результата. По умолчанию рубли; учитывай предпочтение пользователя.
list_recipes:
  description: Рецепты свечей с нормами расхода материалов на 1 шт.
get_recipe_cost:
  description: Себестоимость одной свечи по рецепту — норма × средневзвешенная цена свободного остатка, с разбивкой по материалам. Для вопросов «что если цена изменится» возьми отсюда числа и пересчитай в Code Interpreter.
  params:
    recipe: Название рецепта, например «Лаванда».
    currency: Валюта результата. По умолчанию рубли; учитывай предпочтение пользователя.
prepare_dataset:
  description: Готовит CSV-файл с данными для Code Interpreter и возвращает путь к нему, колонки и первые строки. Используй перед построением графиков и большими расчётами.
  params:
    kind: "consumption — расход материалов в производство по дням; stock — остатки материалов; batches — партии с ценами; jobs — задания; deficit — дефицит по заданиям; recipe_cost — состав и себестоимость рецепта."
    date_from: Начало периода (для consumption, batches, jobs, deficit), ГГГГ-ММ-ДД.
    date_to: Конец периода включительно, ГГГГ-ММ-ДД.
    material: Ограничить материалом — код или название (для consumption и batches).
    recipe: Название рецепта (обязательно для recipe_cost).
save_user_fact:
  description: Запоминает устойчивый факт или предпочтение, которое пользователь сам сообщил о себе.
  params:
    fact: Короткая формулировка от третьего лица, например «Предпочитает считать в евро».
propose_create_and_plan_job:
  description: Готовит предложение создать и запланировать производственное задание. Данные не меняются, пока пользователь не нажмёт «Подтвердить». Возвращает пробный расчёт резерва и дефицита.
  params:
    recipe: Название рецепта, например «Лаванда».
    qty: Сколько свечей, целое число.
    planned_date: Плановая дата, ГГГГ-ММ-ДД, не раньше сегодня.
propose_cancel_job:
  description: Готовит предложение отменить ОДНО задание (черновик или запланированное). Данные не меняются, пока пользователь не нажмёт «Подтвердить».
  params:
    job_number: Номер задания, например З-000003.
