# Короткие тексты для модели, которые код добавляет к данным: пояснения к результатам инструментов
# и служебные пометки в истории диалога. Ключ — имя текста, {…} — подстановки (prompts.note).

# ---------- к результатам инструментов ----------

# Правило живёт рядом с точными числами, а не в системном промпте: там оно сбивало выбор инструментов
# в вопросах, где денег нет вовсе (эвал overdue: 42 из 50 → 23 из 40).
money: "Считай по точным значениям, а в ответе округляй деньги до копеек (2 знака)."
overdue_means: "плановая дата раньше сегодняшней, а задание запланировано или в работе"
# Поиск простил опечатку: модель обязана сказать пользователю, что показано похожее.
similar_materials: "Материала «{query}» нет; показаны похожие: {names}."
similar_supplier: "Поставщика «{query}» нет; показаны партии похожего: {name}."
several_suppliers: "Поставщик «{query}» не найден. Похожие: {names}. Уточните у пользователя."
cost_incomplete: "Оценка НЕПОЛНАЯ, обязательно скажи об этом: из-за дефицита не оценено {missing}."
dataset_empty: "Данных за период нет, файл не создан."
action_proposed: "Предложение показано пользователю и ЖДЁТ подтверждения. Данные ещё не изменены."

# ---------- в историю диалога и системный промпт ----------

interrupted: "[ответ был прерван]"
code_run: "[Выполнен код]\n{code}\n[Вывод]\n{logs}"
no_facts: "- пока нет"
no_files: "Пользователь файлов не загружал."
