# В журнал не пишем строку параметров: в ней бывают имена поставщиков.
log_format no_args '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log no_args;
    error_log /var/log/nginx/error.log crit; # обычные ошибки содержат полный адрес запроса
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # SSE: отдаём куски сразу, не копим в буфере и не обрываем долгий ответ.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /docs { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }

    # Файлы сборки: в имени — хэш содержимого, поэтому файл с таким именем никогда не меняется
    # и браузер может хранить его сколько угодно. Нет файла — честный 404, а не страница приложения.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        # Страницу приложения браузер каждый раз сверяет с сервером. Иначе после обновления он
        # показывал бы старую страницу из кэша, а в ней — ссылка на старые файлы сборки.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
