# В журнал не пишем строку параметров: в ней бывают имена поставщиков.
log_format no_args '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log no_args;
    error_log /var/log/nginx/error.log crit; # обычные ошибки содержат полный адрес запроса
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # SSE: отдаём куски сразу, не копим в буфере и не обрываем долгий ответ.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /docs { proxy_pass http://backend:8000; }
    location = /openapi.json { proxy_pass http://backend:8000; }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
